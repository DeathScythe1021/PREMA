<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Postage 郵票設計｜示範封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Archivo+Narrow:wght@400;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #EFE6D2; --ink: #1F2A44; --a1: #C8352B; --a2: #2C5BA8; --a3: #2C5BA8; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

.slide {
  --paper: oklch(from var(--bg) calc(l + 0.045) c h);
  --shade: oklch(from var(--bg) calc(l * 0.35) c h / 0.35);
  font-family: "Archivo Narrow", "Noto Serif TC", sans-serif;
}
/* 航空郵件斜紋邊 */
.airmail {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg,
    var(--a1) 0 46px, var(--bg) 46px 68px, var(--a2) 68px 114px, var(--bg) 114px 136px);
}
.envelope {
  position: absolute; inset: 34px;
  background:
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 2.5%, transparent) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--ink) 2%, transparent) 0 1px, transparent 1px 11px),
    var(--bg);
}

/* 郵票 */
.stamp-wrap {
  position: absolute; left: 150px; top: 92px; width: 672px; height: 896px;
  transform: rotate(-2deg);
  filter: drop-shadow(6px 10px 10px var(--shade));
}
.stamp {
  position: absolute; inset: 0; background: var(--paper);
  -webkit-mask:
    linear-gradient(var(--ink) 0 0) center / calc(100% - 32px) calc(100% - 32px) no-repeat,
    radial-gradient(circle, transparent 9.5px, var(--ink) 10px) -16px -16px / 32px 32px;
          mask:
    linear-gradient(var(--ink) 0 0) center / calc(100% - 32px) calc(100% - 32px) no-repeat,
    radial-gradient(circle, transparent 9.5px, var(--ink) 10px) -16px -16px / 32px 32px;
}
.stamp-in { position: absolute; left: 36px; top: 36px; width: 600px; height: 824px; }
.country {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink);
  font-family: "Archivo Narrow", "Noto Serif TC", sans-serif; font-weight: 600;
  font-size: 26px; letter-spacing: 0.32em; text-transform: uppercase;
}
.ph {
  position: absolute; left: 0; top: 74px; width: 600px; height: 750px;
  outline: 3px solid var(--a1); outline-offset: -3px; overflow: hidden;
}
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph .tag {
  position: absolute; left: 28px; top: 28px; padding: 8px 14px;
  background: var(--paper); border: 2px solid var(--ink);
  font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em;
}
.denom {
  position: absolute; right: 3px; bottom: 3px; padding: 6px 20px 0 24px;
  background: var(--paper);
  font-family: "Old Standard TT", serif; font-weight: 700; font-size: 150px; line-height: 1;
}
.denom small { font-size: 34px; font-weight: 400; font-style: italic; vertical-align: top; margin-left: 4px; }

/* SVG 顏色 */
.c-a1 { fill: var(--a1); } .c-a2 { fill: var(--a2); }
.c-paper { fill: var(--paper); }
.p-sky { fill: url(#dotS); } .p-mid { fill: url(#dotM); } .p-big { fill: url(#dotL); } .p-sun { fill: url(#dotSun); }

/* 郵戳 */
.postmark { position: absolute; left: 640px; top: 96px; width: 760px; height: 330px; opacity: 0.88; transform: rotate(-8deg); }
.pm-line { fill: none; stroke: var(--ink); }
.pm-text { fill: var(--ink); font-family: "Archivo Narrow", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 5px; }
.pm-date { fill: var(--ink); font-family: "Old Standard TT", serif; font-weight: 700; font-size: 40px; }

/* 右側：信封上的字 */
.par-avion {
  position: absolute; right: 120px; top: 92px; padding: 6px;
  background: repeating-linear-gradient(-45deg, var(--a1) 0 12px, var(--paper) 12px 18px, var(--a2) 18px 30px, var(--paper) 30px 36px);
  transform: rotate(1.5deg);
}
.par-avion div {
  background: var(--paper); padding: 10px 22px; text-align: center;
  font-family: "Archivo Narrow", sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.28em; line-height: 1.25;
}
.par-avion b { display: block; font-family: "Old Standard TT", serif; font-style: italic; font-weight: 700; font-size: 34px; letter-spacing: 0.06em; }

.title {
  position: absolute; left: 980px; top: 410px; margin: 0;
  font-family: "Old Standard TT", "Noto Serif TC", serif; font-weight: 700;
  font-size: 172px; line-height: 1.06; letter-spacing: 0.02em;
}
.sub {
  position: absolute; left: 986px; top: 790px; margin: 0;
  font-family: "Old Standard TT", serif; font-style: italic; font-weight: 400; font-size: 62px;
}
.addr {
  position: absolute; left: 986px; top: 900px; width: 760px;
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 10px; border-bottom: 2px solid var(--ink);
  font-family: "Archivo Narrow", "Noto Serif TC", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: 0.14em;
}
.addr::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -10px; border-bottom: 1px solid var(--ink);
}
</style>
</head>
<body>
<main class="slide">
  <div class="airmail"></div>
  <div class="envelope"></div>

  <div class="stamp-wrap">
    <div class="stamp">
      <div class="stamp-in">
        <div class="country"><span>2026 品牌提案</span></div>
        <div class="ph" data-slot="cover-photo" data-ratio="4/5">
          <svg viewBox="0 0 600 750" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <pattern id="dotS" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="1.4" class="c-a2"/></pattern>
              <pattern id="dotM" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="3" class="c-a2"/></pattern>
              <pattern id="dotL" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="4.6" class="c-a2"/></pattern>
              <pattern id="dotSun" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="4.4" class="c-a1"/></pattern>
            </defs>
            <rect width="600" height="750" class="c-paper"/>
            <rect width="600" height="420" class="p-sky"/>
            <circle cx="400" cy="300" r="120" class="p-sun"/>
            <path d="M0 470 L90 380 L170 430 L270 300 L360 410 L450 340 L600 450 L600 750 L0 750Z" class="p-mid"/>
            <path d="M0 560 L120 480 L230 540 L330 470 L470 560 L600 520 L600 750 L0 750Z" class="p-big"/>
            <path d="M0 660 C120 630 220 690 330 650 C430 615 520 660 600 640 L600 750 L0 750Z" class="c-a2"/>
          </svg>
          <div class="tag">郵票圖案｜4:5</div>
          <div class="denom">01<small>p</small></div>
        </div>
      </div>
    </div>
  </div>

  <svg class="postmark" viewBox="0 0 760 330" aria-hidden="true">
    <defs>
      <path id="arcTop" d="M55 165 A110 110 0 0 1 275 165"/>
      <path id="arcBot" d="M40 165 A125 125 0 0 0 290 165"/>
    </defs>
    <circle cx="165" cy="165" r="148" class="pm-line" stroke-width="5"/>
    <circle cx="165" cy="165" r="88" class="pm-line" stroke-width="3"/>
    <text class="pm-text"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">BRAND PROPOSAL</textPath></text>
    <text class="pm-text"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">IDEA · POST</textPath></text>
    <line x1="92" y1="140" x2="238" y2="140" class="pm-line" stroke-width="3"/>
    <line x1="92" y1="190" x2="238" y2="190" class="pm-line" stroke-width="3"/>
    <text x="165" y="180" text-anchor="middle" class="pm-date">2026.11</text>
    <g class="pm-line" stroke-width="6" stroke-linecap="round">
      <path d="M330 95 q30 -22 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
      <path d="M330 140 q30 -22 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
      <path d="M330 185 q30 -22 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
      <path d="M330 230 q30 -22 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    </g>
  </svg>

  <div class="par-avion"><div><b>Par Avion</b>AIR MAIL</div></div>

  <h1 class="title">把想法<br>做成產品</h1>
  <p class="sub">From Idea to Product</p>
  <div class="addr"><span>[講者姓名]</span><span>2026.11</span></div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
