<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Southwestern 美西沙漠｜示範封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@400;700&family=Noto+Serif+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1E2C8;
  --ink: #3A2218;
  --a1: #B4502B; --a2: #1D7A73; --a3: #D9A13A;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

.slide { font-family: "Bitter", "Noto Serif TC", serif; }

/* 天空：往地平線慢慢染上夕陽色 */
.sky { position: absolute; left: 0; top: 0; width: 1920px; height: 880px;
  background: linear-gradient(180deg, var(--bg) 0 38%, color-mix(in srgb, var(--a3) 22%, var(--bg)) 78%, color-mix(in srgb, var(--a1) 22%, var(--bg)) 100%); }

/* 地景：夕陽、台地、仙人掌 */
.land { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.sun4 { fill: color-mix(in srgb, var(--a1) 30%, var(--bg)); }
.sun3 { fill: var(--a1); }
.sun2 { fill: color-mix(in srgb, var(--a1) 50%, var(--a3)); }
.sun1 { fill: var(--a3); }
.mesa-far  { fill: color-mix(in srgb, var(--a1) 42%, var(--bg)); }
.mesa-near { fill: oklch(from var(--a1) calc(l - 0.14) c h); }
.ground    { fill: color-mix(in srgb, var(--a1) 18%, var(--bg)); }
.dune      { fill: none; stroke: color-mix(in srgb, var(--a1) 40%, var(--bg)); stroke-width: 3; stroke-linecap: round; }
.cactus    { fill: oklch(from var(--a2) calc(l - 0.05) c h); }
.spark     { fill: var(--a3); }
.spark2    { fill: var(--a2); }

/* 幾何紋樣帶（階梯、菱形、鋸齒，自己組合的簡單形狀） */
.band { position: absolute; left: 0; width: 1920px; }
.band.top { top: 0; height: 84px; }
.band.bot { bottom: 0; height: 100px; }
.b-base { fill: var(--ink); }
.b-line { fill: var(--a3); }
.b-step { fill: var(--a1); }
.b-dia  { fill: var(--a2); }
.b-dot  { fill: var(--a3); }
.b-zig  { fill: none; stroke: var(--a3); stroke-width: 4; stroke-linejoin: miter; }

/* 文字 */
.copy { position: absolute; left: 140px; top: 150px; }
.kicker { display: flex; align-items: center; gap: 18px; font: 700 28px/1 "Bitter", "Noto Serif TC", serif; letter-spacing: .3em; text-transform: uppercase; }
.kicker svg { width: 22px; height: 22px; }
h1 { margin: 34px 0 0; font: 900 128px/1.1 "Noto Serif TC", serif; letter-spacing: .02em; }
.en { margin: 22px 0 0; font: 400 64px/1.1 "Rye", serif; letter-spacing: .02em; }
.meta { margin-top: 28px; display: flex; align-items: center; gap: 16px; font: 400 28px/1 "Bitter", "Noto Serif TC", serif; letter-spacing: .08em; }
.meta i { width: 70px; height: 3px; background: var(--ink); }

/* 頁碼：墨色星章 */
.folio { position: absolute; left: 1752px; top: 128px; width: 76px; height: 76px; border-radius: 50%;
  background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center;
  font: 700 28px/1 "Bitter", serif; letter-spacing: .04em;
  box-shadow: 0 0 0 5px var(--bg), 0 0 0 8px var(--a2); }

/* 拱形版位 */
.ph { position: absolute; left: 1150px; top: 380px; width: 640px; height: 480px; box-sizing: border-box;
  border-radius: 320px 320px 0 0; border: 6px solid var(--a1); overflow: hidden;
  background: color-mix(in srgb, var(--a3) 14%, var(--bg)); }
.ph::before { content: ""; position: absolute; inset: 10px 10px 0; border: 2px solid var(--a1); border-bottom: 0; border-radius: 304px 304px 0 0; }
.ph svg { position: absolute; left: 0; top: 0; width: 628px; height: 474px; }
.ph span { position: absolute; left: 0; right: 0; top: 272px; text-align: center; font: 700 32px/1 "Bitter", "Noto Serif TC", serif; letter-spacing: .1em; }
.ph-sun1 { fill: var(--a3); } .ph-sun2 { fill: color-mix(in srgb, var(--a1) 55%, var(--a3)); } .ph-sun3 { fill: color-mix(in srgb, var(--a1) 35%, var(--bg)); }
.ph-zig { fill: var(--a2); }
</style>
</head>
<body>
<main class="slide">
  <div class="sky"></div>

  <svg class="land" viewBox="0 0 1920 1080" aria-hidden="true">
    <!-- 日落同心半圓 -->
    <circle class="sun4" cx="590" cy="880" r="320"/>
    <circle class="sun3" cx="590" cy="880" r="262"/>
    <circle class="sun2" cx="590" cy="880" r="200"/>
    <circle class="sun1" cx="590" cy="880" r="136"/>
    <!-- 遠方台地 -->
    <path class="mesa-far" d="M0,800 L120,800 L150,770 L330,770 L362,812 L520,812 L540,790 L600,790 L640,830 L860,830 L900,760 L1080,760 L1120,820 L1300,820 L1330,790 L1520,790 L1560,830 L1920,830 L1920,880 L0,880 Z"/>
    <!-- 近處台地 -->

    <path class="cactus" d="M1032,900 L1032,690 C1032,668 1066,668 1066,690 L1066,780 L1094,780 L1094,730 C1094,712 1120,712 1120,730 L1120,792 C1120,806 1110,812 1098,812 L1066,812 L1066,900 Z M1032,820 L1004,820 C992,820 984,812 984,800 L984,748 C984,732 1008,732 1008,748 L1008,794 L1032,794 Z"/>
    <path class="cactus" d="M154,900 L154,820 C154,806 174,806 174,820 L174,856 L188,856 L188,834 C188,824 202,824 202,834 L202,864 C202,870 198,874 192,874 L174,874 L174,900 Z"/>
    <!-- 星芒 -->
    <path class="spark" d="M1130,150 L1138,176 L1164,184 L1138,192 L1130,218 L1122,192 L1096,184 L1122,176 Z"/>
    <path class="spark2" d="M1196,250 L1200,264 L1214,268 L1200,272 L1196,286 L1192,272 L1178,268 L1192,264 Z"/>
    <path class="spark" d="M1640,250 L1645,266 L1661,271 L1645,276 L1640,292 L1635,276 L1619,271 L1635,266 Z"/>
  </svg>

  <!-- 紋樣帶 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="sw" width="128" height="84" patternUnits="userSpaceOnUse">
        <rect class="b-base" width="128" height="84"/>
        <rect class="b-line" y="8" width="128" height="4"/>
        <rect class="b-line" y="72" width="128" height="4"/>
        <!-- 階梯山形 -->
        <path class="b-step" d="M4,64 L4,58 L12,58 L12,50 L20,50 L20,42 L28,42 L28,34 L36,34 L36,26 L28,26 L28,26 L36,26 L36,20 L44,20 L44,26 L52,26 L52,34 L60,34 L60,42 L68,42 L68,50 L76,50 L76,58 L84,58 L84,64 Z"/>
        <!-- 菱形 -->
        <path class="b-dia" d="M106,22 L124,42 L106,62 L88,42 Z"/>
        <path class="b-dot" d="M106,34 L113,42 L106,50 L99,42 Z"/>
      </pattern>
    </defs>
  </svg>
  <svg class="band top" viewBox="0 0 1920 84" preserveAspectRatio="none" aria-hidden="true"><rect width="1920" height="84" fill="url(#sw)"/></svg>
  <svg class="band bot" viewBox="0 0 1920 100" preserveAspectRatio="none" aria-hidden="true">
    <rect class="b-base" width="1920" height="100"/>
    <rect y="16" width="1920" height="84" fill="url(#sw)"/>
    <path class="b-zig" d="M0,12 L16,2 L32,12 L48,2 L64,12 L80,2 L96,12 L112,2 L128,12 L144,2 L160,12 L176,2 L192,12 L208,2 L224,12 L240,2 L256,12 L272,2 L288,12 L304,2 L320,12 L336,2 L352,12 L368,2 L384,12 L400,2 L416,12 L432,2 L448,12 L464,2 L480,12 L496,2 L512,12 L528,2 L544,12 L560,2 L576,12 L592,2 L608,12 L624,2 L640,12 L656,2 L672,12 L688,2 L704,12 L720,2 L736,12 L752,2 L768,12 L784,2 L800,12 L816,2 L832,12 L848,2 L864,12 L880,2 L896,12 L912,2 L928,12 L944,2 L960,12 L976,2 L992,12 L1008,2 L1024,12 L1040,2 L1056,12 L1072,2 L1088,12 L1104,2 L1120,12 L1136,2 L1152,12 L1168,2 L1184,12 L1200,2 L1216,12 L1232,2 L1248,12 L1264,2 L1280,12 L1296,2 L1312,12 L1328,2 L1344,12 L1360,2 L1376,12 L1392,2 L1408,12 L1424,2 L1440,12 L1456,2 L1472,12 L1488,2 L1504,12 L1520,2 L1536,12 L1552,2 L1568,12 L1584,2 L1600,12 L1616,2 L1632,12 L1648,2 L1664,12 L1680,2 L1696,12 L1712,2 L1728,12 L1744,2 L1760,12 L1776,2 L1792,12 L1808,2 L1824,12 L1840,2 L1856,12 L1872,2 L1888,12 L1904,2 L1920,12"/>
  </svg>

  <section class="copy">
    <div class="kicker">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path class="b-dia" d="M11,0 L22,11 L11,22 L0,11 Z"/></svg>
      2026 品牌提案
      <svg viewBox="0 0 22 22" aria-hidden="true"><path class="b-dia" d="M11,0 L22,11 L11,22 L0,11 Z"/></svg>
    </div>
    <h1>把想法做成產品</h1>
    <p class="en">From Idea to Product</p>
    <div class="meta"><i></i>[講者姓名]　2026.11</div>
  </section>

  <div class="folio">01</div>

  <div class="ph" data-slot="cover-photo" data-ratio="4/3">
    <svg viewBox="0 0 628 474" aria-hidden="true">
      <circle class="ph-sun3" cx="314" cy="236" r="132"/>
      <circle class="ph-sun2" cx="314" cy="236" r="96"/>
      <circle class="ph-sun1" cx="314" cy="236" r="60"/>
      <rect x="0" y="236" width="628" height="238" style="fill: color-mix(in srgb, var(--a3) 14%, var(--bg))"/>
      <path class="ph-zig" d="M0,474 L0,444 L26,420 L52,444 L78,420 L104,444 L130,420 L156,444 L182,420 L208,444 L234,420 L260,444 L286,420 L312,444 L338,420 L364,444 L390,420 L416,444 L442,420 L468,444 L494,420 L520,444 L546,420 L572,444 L598,420 L624,444 L628,440 L628,474 Z"/>
    </svg>
    <span>沙漠照片｜4:3</span>
  </div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
