.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

.slide * { box-sizing: border-box; }
.abs { position: absolute; }
.forest { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.type { font-family: "Courier Prime", "Noto Sans TC", monospace; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

.en { left: 116px; top: 624px; font-family: "Anton", sans-serif; font-size: 92px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; }

.info { left: 120px; top: 960px; font-size: 26px; font-weight: 400; }
.info b { font-weight: 700; }

/* polaroid evidence photo */
.polaroid { left: 1150px; top: 196px; width: 500px; height: 462px; background: var(--ink); padding: 28px 28px 104px; transform: rotate(-3.5deg); box-shadow: 0 20px 40px color-mix(in srgb, var(--bg) 70%, transparent); }

.ph .blur { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph span { position: relative; font-size: 22px; line-height: 1.5; text-align: center; letter-spacing: .02em; white-space: nowrap; transform: translateY(40px); }
.tape { position: absolute; left: 180px; top: -20px; width: 140px; height: 40px; background: color-mix(in srgb, var(--a1) 45%, transparent); transform: rotate(4deg); }
