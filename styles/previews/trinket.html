<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>小物收藏 Trinket Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #FBF6EF; --ink: #3A2433; --a1: #D23C77; --a2: #2D7FB8; --a3: #F2B632; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

.slide { --metal: color-mix(in srgb, var(--a3) 58%, var(--ink)); --sh: color-mix(in srgb, var(--ink) 24%, transparent);
  font-family: "Nunito", "Noto Sans TC", sans-serif; }
/* soft ground: a felt tray the trinkets sit on */
.ground { position: absolute; inset: 0; background:
  radial-gradient(circle, color-mix(in srgb, var(--ink) 6%, transparent) 0 1.5px, transparent 2px) 0 0 / 26px 26px,
  color-mix(in srgb, var(--a1) 13%, var(--bg)); }
svg.art { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.m { fill: none; stroke: var(--metal); stroke-width: 7; }
.b1 { fill: var(--a1); } .b2 { fill: var(--a2); } .b3 { fill: var(--a3); } .bb { fill: var(--bg); }
.hi { fill: color-mix(in srgb, var(--bg) 75%, transparent); }
.pin { filter: drop-shadow(0 8px 6px var(--sh)); }

/* sticker title: ink letters, thick die-cut border in --bg */
.title { position: absolute; left: 112px; top: 300px; margin: 0; transform: rotate(-2.5deg); transform-origin: left center;
  font-family: "Fredoka", "Noto Sans TC", sans-serif; font-weight: 700; font-size: 152px; line-height: 1.1; letter-spacing: 8px;
  -webkit-text-stroke: 34px var(--bg); paint-order: stroke fill; filter: drop-shadow(0 10px 10px var(--sh)); white-space: nowrap; }
.title span { font-family: "Noto Sans TC", sans-serif; }

.en { position: absolute; left: 150px; top: 540px; transform: rotate(2deg);
  background: var(--ink); color: var(--bg); border: 12px solid var(--bg); border-radius: 999px; padding: 10px 46px 14px;
  font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 58px; letter-spacing: 1px; filter: drop-shadow(0 8px 8px var(--sh)); }

.tag { position: absolute; background: var(--bg); border-radius: 14px 22px 22px 14px; padding: 18px 34px 18px 82px;
  font-size: 34px; font-weight: 700; white-space: nowrap; filter: drop-shadow(0 8px 8px var(--sh));
  clip-path: polygon(0 26%, 34px 0, 100% 0, 100% 100%, 34px 100%, 0 74%); }
.tag::before { content: ""; position: absolute; left: 30px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%;
  background: color-mix(in srgb, var(--a1) 13%, var(--bg)); box-shadow: 0 0 0 6px var(--metal); }
.tag.k { left: 196px; top: 128px; transform: rotate(-7deg); transform-origin: 41px 50%; }
.tag.k b { font-family: "Fredoka", sans-serif; font-weight: 700; margin-right: 12px; }
.tag.i { left: 1318px; top: 820px; transform: rotate(9deg); transform-origin: 41px 50%; font-size: 30px; }
.tag.i .zh { font-family: "Noto Sans TC", sans-serif; }

.pg { position: absolute; right: 86px; top: 70px; width: 148px; height: 148px; border-radius: 50%; box-sizing: border-box;
  background: var(--ink); color: var(--bg); border: 10px solid var(--metal); display: grid; place-items: center;
  font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 66px; line-height: 1; filter: drop-shadow(0 8px 6px var(--sh)); }
.pg::after { content: ""; position: absolute; left: 22px; top: 16px; width: 46px; height: 22px; border-radius: 50%;
  background: color-mix(in srgb, var(--bg) 40%, transparent); transform: rotate(-30deg); }

.ph { position: absolute; left: 1262px; top: 196px; width: 470px; height: 470px; box-sizing: border-box; transform: rotate(4deg);
  border: 24px solid var(--bg); border-radius: 64px; filter: drop-shadow(0 12px 12px var(--sh));
  background: radial-gradient(circle, color-mix(in srgb, var(--ink) 14%, transparent) 0 3px, transparent 3.5px) 0 0 / 30px 30px,
    color-mix(in srgb, var(--ink) 6%, var(--bg));
  display: grid; place-items: center; }
.ph span { background: var(--bg); border-radius: 999px; padding: 8px 26px; font-family: "Noto Sans TC", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 2px; }
</style>
</head>
<body>
<main class="slide">
  <div class="ground"></div>

  <svg class="art" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <path id="sp" d="M0,-22 C3,-4 4,-3 22,0 C4,3 3,4 0,22 C-3,4 -4,3 -22,0 C-4,-3 -3,-4 0,-22 Z"/>
      <g id="chain"><ellipse class="m" cx="0" cy="0" rx="9" ry="15"/><rect x="-3.5" y="16" width="7" height="30" rx="3.5" style="fill:var(--metal)"/><ellipse class="m" cx="0" cy="62" rx="9" ry="15"/><rect x="-3.5" y="78" width="7" height="30" rx="3.5" style="fill:var(--metal)"/><ellipse class="m" cx="0" cy="124" rx="9" ry="15"/><rect x="-3.5" y="140" width="7" height="30" rx="3.5" style="fill:var(--metal)"/><ellipse class="m" cx="0" cy="186" rx="9" ry="15"/><rect x="-3.5" y="202" width="7" height="30" rx="3.5" style="fill:var(--metal)"/></g>
    </defs>

    <!-- chains -->
    <use href="#chain" transform="translate(237 -84)"/>
    <use href="#chain" transform="translate(1366 630) rotate(-2)"/>

    <!-- bead strand -->
    <path d="M60,936 C420,850 820,1010 1200,890" style="fill:none;stroke:color-mix(in srgb, var(--ink) 40%, transparent);stroke-width:4"/>
    <g class="pin">
      <circle class="b1" cx="129" cy="921" r="26"/><circle class="b2" cx="181" cy="913" r="20"/><circle class="b3" cx="234" cy="908" r="20"/><circle class="bb" cx="288" cy="906" r="26"/><circle class="b1" cx="342" cy="906" r="20"/><circle class="b2" cx="398" cy="908" r="20"/><circle class="b3" cx="453" cy="911" r="26"/><circle class="bb" cx="510" cy="916" r="20"/><circle class="b1" cx="566" cy="920" r="20"/><circle class="b2" cx="623" cy="925" r="26"/><circle class="b3" cx="680" cy="930" r="20"/><circle class="bb" cx="738" cy="934" r="20"/><circle class="b1" cx="795" cy="936" r="26"/><circle class="b2" cx="853" cy="938" r="20"/><circle class="b3" cx="910" cy="937" r="20"/><circle class="bb" cx="967" cy="934" r="26"/><circle class="b1" cx="1024" cy="928" r="20"/><circle class="b2" cx="1080" cy="919" r="20"/><circle class="b3" cx="1136" cy="907" r="26"/>
    </g>
    <g class="hi"><circle cx="121" cy="913" r="6"/><circle cx="175" cy="907" r="5"/><circle cx="228" cy="902" r="5"/><circle cx="280" cy="898" r="6"/><circle cx="336" cy="900" r="5"/><circle cx="392" cy="902" r="5"/><circle cx="445" cy="903" r="6"/><circle cx="504" cy="910" r="5"/><circle cx="560" cy="914" r="5"/><circle cx="615" cy="917" r="6"/><circle cx="674" cy="924" r="5"/><circle cx="732" cy="928" r="5"/><circle cx="787" cy="928" r="6"/><circle cx="847" cy="932" r="5"/><circle cx="904" cy="931" r="5"/><circle cx="959" cy="926" r="6"/><circle cx="1018" cy="922" r="5"/><circle cx="1074" cy="913" r="5"/><circle cx="1128" cy="899" r="6"/></g>

    <!-- enamel pins: metal rim + flat enamel + gloss -->
    <g class="pin" transform="translate(1104 168) rotate(12)">
      <path d="M0,-74 L19,-26 L70,-23 L31,10 L44,60 L0,32 L-44,60 L-31,10 L-70,-23 L-19,-26 Z" style="fill:var(--a3);stroke:var(--metal);stroke-width:12;stroke-linejoin:round"/>
      <path d="M-8,-44 L-16,-22" style="stroke:color-mix(in srgb, var(--bg) 70%, transparent);stroke-width:9;stroke-linecap:round"/>
    </g>
    <g class="pin" transform="translate(1104 640) rotate(-10) scale(1.35)">
      <path d="M0,44 C-56,8 -70,-28 -46,-48 C-26,-62 -6,-52 0,-36 C6,-52 26,-62 46,-48 C70,-28 56,8 0,44 Z" style="fill:var(--a1);stroke:var(--metal);stroke-width:9;stroke-linejoin:round"/>
      <path d="M-40,-30 C-38,-40 -30,-44 -22,-44" style="fill:none;stroke:color-mix(in srgb, var(--bg) 70%, transparent);stroke-width:7;stroke-linecap:round"/>
    </g>
    <g class="pin" transform="translate(1806 800) scale(.9)">
      <circle r="62" style="fill:var(--a2);stroke:var(--metal);stroke-width:10"/>
      <circle r="24" style="fill:color-mix(in srgb, var(--a1) 13%, var(--bg));stroke:var(--metal);stroke-width:8"/>
      <path d="M-40,-22 A46,46 0 0 1 -18,-42" style="fill:none;stroke:color-mix(in srgb, var(--bg) 65%, transparent);stroke-width:8;stroke-linecap:round"/>
    </g>

    <!-- sparkles and tiny hearts -->
    <use href="#sp" class="b2" transform="translate(890 250) scale(1.2)"/>
    <use href="#sp" class="b3" transform="translate(1214 760) scale(.9)"/>
    <use href="#sp" class="b1" transform="translate(96 690) scale(1)"/>
    <use href="#sp" class="b3" transform="translate(1790 1000) scale(1.3)"/>
    <use href="#sp" class="b2" transform="translate(760 140) scale(.8)"/>
    <path class="b1" transform="translate(1210 1000) scale(.32)" d="M0,44 C-56,8 -70,-28 -46,-48 C-26,-62 -6,-52 0,-36 C6,-52 26,-62 46,-48 C70,-28 56,8 0,44 Z"/>
  </svg>

  <div class="tag k"><b>2026</b><span style="font-family:'Noto Sans TC',sans-serif">品牌提案</span></div>

  <h1 class="title"><span>把想法做成產品</span></h1>
  <div class="en">From Idea to Product</div>

  <div class="ph" data-slot="cover-photo" data-ratio="1/1"><span>小物照片｜去背</span></div>
  <div class="tag i"><span class="zh">[講者姓名]</span>　2026.11</div>

  <div class="pg">01</div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
