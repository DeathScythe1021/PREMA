<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Light Academia 明亮學院｜示範封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;1,400&family=Noto+Serif+TC:wght@400;600&family=LXGW+WenKai+TC:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EDE2;
  --ink: #3B2F25;
  --a1: #8A6A45; --a2: #D9C3A0; --a3: #D9C3A0;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

.slide { font-family: "Lora", "Noto Serif TC", serif; }

/* 窗影：斜斜落在牆上的四格光 */
.window { position: absolute; left: 880px; top: -60px; width: 1100px; height: 1000px; filter: blur(22px); opacity: .55; }
.window path { fill: color-mix(in srgb, var(--a2) 70%, transparent); }

/* 細線與星號 */
.line { stroke: var(--a1); stroke-width: 1.2; fill: none; }
.star { fill: var(--a1); }

/* 窄欄 */
.col { position: absolute; left: 300px; top: 168px; width: 600px; }
.kicker { display: flex; align-items: center; gap: 18px; font: 400 24px/1 "Cormorant", "Noto Serif TC", serif; letter-spacing: .32em; }
.kicker svg { width: 22px; height: 22px; }
.kicker .num { font-family: "Cormorant", serif; font-weight: 600; letter-spacing: .2em; }
.kicker i { width: 60px; height: 1px; background: var(--a1); }
h1 { margin: 64px 0 0; font: 400 112px/1.32 "Noto Serif TC", serif; letter-spacing: .1em; }
.hand { position: absolute; left: 470px; top: 150px; transform: rotate(-5deg); transform-origin: 0 50%;
  font: 400 32px/1.3 "LXGW WenKai TC", "Noto Serif TC", serif; white-space: nowrap; }
.hand-arrow { position: absolute; left: 378px; top: 172px; width: 90px; height: 70px; }
.divider { display: block; width: 420px; height: 24px; margin: 52px 0 40px; }
.sub { margin: 0; font: italic 400 58px/1.1 "Cormorant", serif; letter-spacing: .02em; }

.folio { position: absolute; left: 300px; bottom: 96px; display: flex; align-items: center; gap: 20px;
  font: 600 24px/1 "Cormorant", serif; letter-spacing: .3em; }
.folio i { width: 120px; height: 1px; background: var(--a1); }

/* 拱形版位 */
.ph { position: absolute; left: 1190px; top: 150px; width: 480px; height: 640px; box-sizing: border-box;
  border: 1.5px solid var(--a1); border-radius: 240px 240px 0 0;
  background: color-mix(in srgb, var(--a2) 22%, var(--bg)); }
.ph::before { content: ""; position: absolute; inset: 16px; border: 1px solid color-mix(in srgb, var(--a1) 55%, transparent); border-radius: 224px 224px 0 0; }
.ph span { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font: italic 400 30px/1 "Cormorant", serif; letter-spacing: .08em; }
.ph-cap { position: absolute; left: 1290px; top: 818px; width: 280px; display: flex; justify-content: center; white-space: nowrap;
  font: 400 22px/1 "Cormorant", serif; letter-spacing: .28em; }
.ph-cap i { width: 40px; height: 1px; margin: 10px 16px 0; background: color-mix(in srgb, var(--a1) 60%, transparent); }

/* 乾燥花枝 */
.sprig { position: absolute; left: 1010px; top: 470px; width: 330px; height: 470px; }
.sprig .st { fill: none; stroke: var(--a1); stroke-width: 2; stroke-linecap: round; }
.sprig .lf { fill: color-mix(in srgb, var(--a2) 75%, var(--bg)); stroke: var(--a1); stroke-width: 1.6; }
.sprig .sd { fill: var(--a1); }
</style>
</head>
<body>
<main class="slide">
  <svg class="window" viewBox="0 0 1100 1000" aria-hidden="true">
    <path d="M330,40 L560,40 L470,430 L200,430 Z"/>
    <path d="M600,40 L830,40 L760,430 L510,430 Z"/>
    <path d="M190,470 L460,470 L370,880 L60,880 Z"/>
    <path d="M500,470 L750,470 L680,880 L410,880 Z"/>
  </svg>

  <section class="col">
    <div class="kicker">
      <svg viewBox="-11 -11 22 22" aria-hidden="true"><path class="star" d="M0,-11 C1,-3 3,-1 11,0 C3,1 1,3 0,11 C-1,3 -3,1 -11,0 C-3,-1 -1,-3 0,-11 Z"/></svg>
      <span class="num">No. I</span><i></i><span>2026 品牌提案</span>
    </div>
    <h1>把想法<br>做成產品</h1>
    <svg class="divider" viewBox="0 0 420 24" aria-hidden="true">
      <line class="line" x1="0" y1="12" x2="180" y2="12"/>
      <path class="star" d="M210,2 C211,9 213,11 220,12 C213,13 211,15 210,22 C209,15 207,13 200,12 C207,11 209,9 210,2 Z"/>
      <line class="line" x1="240" y1="12" x2="420" y2="12"/>
    </svg>
    <p class="sub">From Idea to Product</p>

    <svg class="hand-arrow" viewBox="0 0 90 70" aria-hidden="true">
      <path class="line" stroke-width="1.8" stroke-linecap="round" d="M84,44 C62,56 30,52 14,28"/>
      <path class="line" stroke-width="1.8" stroke-linecap="round" d="M12,42 L13,27 L27,31"/>
    </svg>
    <div class="hand">[講者姓名]　2026.11</div>
  </section>

  <div class="ph" data-slot="cover-photo" data-ratio="3/4"><span>photograph · 3:4</span></div>
  <div class="ph-cap"><i></i><span>Pl. I</span><i></i></div>

  <svg class="sprig" viewBox="0 0 330 470" aria-hidden="true">
    <path class="st" d="M300,468 C250,380 190,300 150,200 C126,140 118,80 128,20"/>
    <path class="st" d="M196,310 C160,280 120,262 70,262"/>
    <path class="st" d="M160,224 C200,190 230,150 246,96"/>
    <path class="st" d="M140,150 C110,128 86,98 76,58"/>
    <path class="lf" d="M232,380 C206,370 190,350 186,326 C210,332 228,352 232,380 Z"/>
    <path class="lf" d="M178,276 C150,286 120,280 104,262 C130,252 160,258 178,276 Z"/>
    <path class="lf" d="M168,196 C176,170 194,154 216,150 C210,176 192,192 168,196 Z"/>
    <path class="lf" d="M136,122 C116,116 104,98 104,80 C122,88 134,104 136,122 Z"/>
    <circle class="sd" cx="128" cy="18" r="6"/><circle class="sd" cx="118" cy="30" r="4.5"/><circle class="sd" cx="138" cy="32" r="4.5"/>
    <circle class="sd" cx="246" cy="92" r="5"/><circle class="sd" cx="256" cy="104" r="3.6"/><circle class="sd" cx="238" cy="106" r="3.6"/>
    <circle class="sd" cx="74" cy="54" r="5"/><circle class="sd" cx="64" cy="66" r="3.6"/>
    <circle class="sd" cx="66" cy="262" r="5"/><circle class="sd" cx="56" cy="252" r="3.6"/><circle class="sd" cx="58" cy="274" r="3.6"/>
  </svg>

  <svg style="position:absolute; left:1730px; top:170px; width:30px; height:30px" viewBox="-11 -11 22 22" aria-hidden="true"><path class="star" d="M0,-11 C1,-3 3,-1 11,0 C3,1 1,3 0,11 C-1,3 -3,1 -11,0 C-3,-1 -1,-3 0,-11 Z"/></svg>
  <svg style="position:absolute; left:1764px; top:214px; width:16px; height:16px" viewBox="-11 -11 22 22" aria-hidden="true"><path class="star" d="M0,-11 C1,-3 3,-1 11,0 C3,1 1,3 0,11 C-1,3 -3,1 -11,0 C-3,-1 -1,-3 0,-11 Z"/></svg>

  <div class="folio"><span>01</span><i></i></div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
