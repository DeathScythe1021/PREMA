<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>水手刺青 Nautical &amp; Tattoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sancreek&family=Libre+Franklin:wght@600;800&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #EFE4CC; --ink: #151414; --a1: #B12A22; --a2: #2F6B3A; --a3: #E3A72F; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

/* flash sheet paper */
.slide::before { content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--ink) 7%, transparent) 0 1.5px, transparent 2px),
    radial-gradient(circle at 70% 80%, color-mix(in srgb, var(--ink) 5%, transparent) 0 1px, transparent 1.5px);
  background-size: 23px 29px, 37px 31px; }
.frame { position: absolute; inset: 34px; border: 8px solid var(--ink); }
.frame::after { content: ""; position: absolute; inset: 12px; border: 4px solid var(--ink); }
svg.art { position: absolute; inset: 0; width: 1920px; height: 1080px; }

.o { stroke: var(--ink); stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }
.ot { stroke: var(--ink); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
.k { fill: var(--ink); } .p { fill: var(--bg); } .r { fill: var(--a1); } .g { fill: var(--a2); } .y { fill: var(--a3); } .n { fill: none; }
.rb { fill: color-mix(in srgb, var(--a3) 14%, var(--bg)); }
.hl { fill: none; stroke: var(--bg); stroke-width: 8; stroke-linecap: round; }
.ray { stroke: var(--ink); stroke-width: 10; stroke-linecap: round; }

.zh-title { font-family: "Noto Sans TC", sans-serif; font-weight: 900; font-size: 104px; letter-spacing: 6px;
  fill: var(--ink); stroke: var(--ink); stroke-width: 3px; }
.en-title { font-family: "Sancreek", "Noto Sans TC", serif; font-size: 52px; fill: var(--ink); letter-spacing: 1px; }
.rb-small { font-family: "Noto Sans TC", sans-serif; font-weight: 900; font-size: 46px; letter-spacing: 12px; fill: var(--ink); }

.kicker { position: absolute; left: 104px; top: 86px; display: flex; align-items: center; gap: 18px;
  font-family: "Libre Franklin", "Noto Sans TC", sans-serif; font-weight: 800; font-size: 36px; letter-spacing: 6px; }
.kicker b { font-family: "Noto Sans TC", sans-serif; font-weight: 900; }
.kicker svg { width: 44px; height: 44px; }

.badge { position: absolute; right: 92px; top: 74px; width: 124px; height: 124px; border-radius: 50%;
  background: var(--ink); color: var(--bg); display: grid; place-items: center;
  font-family: "Libre Franklin", sans-serif; font-weight: 800; font-size: 54px; letter-spacing: 2px; line-height: 1;
  box-shadow: 0 0 0 8px var(--bg), 0 0 0 16px var(--ink); }

.info { position: absolute; right: 96px; bottom: 88px; text-align: right;
  font-family: "Libre Franklin", "Noto Sans TC", sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 4px; text-transform: uppercase; }
.info span { font-family: "Noto Sans TC", sans-serif; font-weight: 900; }
.info::before { content: ""; display: block; height: 8px; background: var(--ink); margin: 0 0 16px auto; width: 100%; }

.ph { position: absolute; left: 1384px; top: 214px; width: 440px; height: 560px; }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ph .lab { position: absolute; left: 50%; top: 330px; transform: translateX(-50%); white-space: nowrap;
  background: var(--bg); border: 6px solid var(--ink); padding: 8px 18px;
  font-family: "Noto Sans TC", sans-serif; font-weight: 900; font-size: 28px; letter-spacing: 3px; }
</style>
</head>
<body>
<main class="slide">
  <div class="frame"></div>

  <svg class="art" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <path id="st" d="M0,-30 L7.05,-9.7 L28.5,-9.3 L11.4,3.7 L17.6,24.3 L0,12 L-17.6,24.3 L-11.4,3.7 L-28.5,-9.3 L-7.05,-9.7 Z"/>
      <g id="pt"><path class="k ot" d="M0,0 L0,-128 L-24,-24 Z"/><path class="y ot" d="M0,0 L0,-128 L24,-24 Z"/></g>
      <g id="sw">
        <path class="k o" d="M48,18 C18,70 -24,104 -96,118 C-66,82 -44,52 -14,12 Z"/>
        <path class="k o" d="M-58,-4 L-196,-54 L-124,4 L-200,58 L-58,10 Z"/>
        <path class="k o" d="M152,-4 C136,-32 96,-36 60,-27 C20,-19 -30,-10 -72,0 C-30,14 20,31 60,29 C96,27 126,14 152,-4 Z"/>
        <path class="p o" d="M112,16 C80,28 30,30 -24,10 C14,6 60,4 92,2 Z"/>
        <path class="r o" d="M152,-4 C140,8 124,15 108,18 C102,6 106,-6 120,-11 C132,-13 144,-10 152,-4 Z"/>
        <path class="k o" d="M62,-24 C44,-84 2,-134 -72,-166 C-42,-114 -32,-72 -12,-14 Z"/>
        <path class="hl" d="M20,-40 C6,-80 -16,-110 -40,-130"/>
        <circle class="p" cx="122" cy="-15" r="7"/><circle class="k" cx="124" cy="-15" r="3"/>
      </g>
    </defs>

    <!-- glory rays behind the anchor -->
    <g transform="translate(690 580)" class="ray">
      <line y1="-330" y2="-400"/><line y1="-340" y2="-372" transform="rotate(11.25)"/>
      <line y1="-330" y2="-400" transform="rotate(22.5)"/><line y1="-340" y2="-372" transform="rotate(33.75)"/>
      
      <line y1="-340" y2="-372" transform="rotate(78.75)"/>
      <line y1="-330" y2="-400" transform="rotate(90)"/><line y1="-340" y2="-372" transform="rotate(101.25)"/>
      <line y1="-330" y2="-400" transform="rotate(112.5)"/><line y1="-340" y2="-372" transform="rotate(123.75)"/>
      <line y1="-340" y2="-372" transform="rotate(-11.25)"/>
      <line y1="-330" y2="-400" transform="rotate(-22.5)"/><line y1="-340" y2="-372" transform="rotate(-33.75)"/>
      
      <line y1="-340" y2="-372" transform="rotate(-78.75)"/>
      <line y1="-330" y2="-400" transform="rotate(-90)"/><line y1="-340" y2="-372" transform="rotate(-101.25)"/>
      <line y1="-330" y2="-400" transform="rotate(-112.5)"/><line y1="-340" y2="-372" transform="rotate(-123.75)"/>
    </g>

    <!-- anchor -->
    <g transform="translate(690 580) scale(.8)">
      <rect class="g o" x="-30" y="-292" width="60" height="560" rx="8" style="stroke-width:11"/>
      <path class="hl" d="M-12,-150 V80" style="stroke-width:10"/>
      <path class="g o" style="stroke-width:11" d="M-252,118 Q-232,322 0,322 Q232,322 252,118 L206,144 Q182,266 0,266 Q-182,266 -206,144 Z"/>
      <path class="hl" d="M-150,250 Q-80,290 -10,292" style="stroke-width:10"/>
      <path class="g o" style="stroke-width:11" d="M-236,36 L-306,176 L-168,160 Z"/>
      <path class="g o" style="stroke-width:11" d="M236,36 L306,176 L168,160 Z"/>
      <circle class="y o" cy="-332" r="58" style="stroke-width:11"/>
      <circle class="p o" cy="-332" r="26" style="stroke-width:11"/>
      <rect class="y o" x="-170" y="-272" width="340" height="50" rx="22" style="stroke-width:11"/>
      <path class="hl" d="M-140,-258 H-40"/>
      <circle class="k" cx="-150" cy="-247" r="9"/><circle class="k" cx="150" cy="-247" r="9"/>
    </g>

    <!-- main ribbon with the Chinese title -->
    <g transform="translate(690 440)">
      <path class="r o" d="M-380,40 L-604,68 L-540,150 L-612,236 L-380,206 Z"/>
      <path class="r o" d="M380,40 L604,68 L540,150 L612,236 L380,206 Z"/>
      <path class="k o" d="M-420,150 L-380,206 L-380,150 Z"/>
      <path class="k o" d="M420,150 L380,206 L380,150 Z"/>
      <path class="rb o" style="stroke-width:10" d="M-420,0 Q0,-90 420,0 L420,150 Q0,60 -420,150 Z"/>
      <path class="n" id="rp" d="M-400,122 Q0,22 400,122"/>
      <text class="zh-title" text-anchor="middle"><textPath href="#rp" startOffset="50%">把想法做成產品</textPath></text>
    </g>

    <!-- small ribbon with English subtitle -->
    <g transform="translate(690 902)">
      <path class="r o" d="M-300,-18 L-438,-8 L-394,36 L-444,82 L-300,62 Z"/>
      <path class="r o" d="M300,-18 L438,-8 L394,36 L444,82 L300,62 Z"/>
      <path class="k o" d="M-336,40 L-300,62 L-300,40 Z"/><path class="k o" d="M336,40 L300,62 L300,40 Z"/>
      <path class="rb o" d="M-336,-40 Q0,10 336,-40 L336,40 Q0,90 -336,40 Z"/>
      <path class="n" id="ep" d="M-316,17 Q0,67 316,17"/>
      <text class="en-title" text-anchor="middle"><textPath href="#ep" startOffset="50%">From Idea to Product</textPath></text>
    </g>

    <!-- swallows -->
    <use href="#sw" transform="translate(300 300) rotate(-14) scale(.95)"/>
    <use href="#sw" transform="translate(1160 300) rotate(14) scale(-.85 .85)"/>

    <!-- compass star -->
    <g transform="translate(200 806) scale(.9)">
      <circle class="p o" r="94"/>
      <circle class="n" r="72" style="stroke:var(--ink);stroke-width:6;stroke-dasharray:4 14"/>
      <use href="#pt" transform="rotate(45) scale(.62)"/><use href="#pt" transform="rotate(135) scale(.62)"/>
      <use href="#pt" transform="rotate(225) scale(.62)"/><use href="#pt" transform="rotate(315) scale(.62)"/>
      <use href="#pt"/><use href="#pt" transform="rotate(90)"/><use href="#pt" transform="rotate(180)"/><use href="#pt" transform="rotate(270)"/>
      <circle class="r o" r="16" style="stroke-width:7"/>
    </g>

    <!-- stars -->
    <g class="y o" style="stroke-width:6">
      <use href="#st" transform="translate(590 128) scale(.8)"/>
      <use href="#st" transform="translate(1010 140) scale(.7)"/>
      <use href="#st" transform="translate(1210 760) scale(1.1)"/>
      <use href="#st" transform="translate(430 980) scale(.75)"/>
          </g>
  </svg>

  <div class="kicker">
    <svg viewBox="-34 -34 68 68" aria-hidden="true"><path d="M0,-30 L7.05,-9.7 L28.5,-9.3 L11.4,3.7 L17.6,24.3 L0,12 L-17.6,24.3 L-11.4,3.7 L-28.5,-9.3 L-7.05,-9.7 Z" style="fill:var(--a3);stroke:var(--ink);stroke-width:5;stroke-linejoin:round"/></svg>
    <span>2026 <b>品牌提案</b></span>
  </div>

  <div class="badge">01</div>

  <div class="ph" data-slot="cover-photo" data-ratio="4/5">
    <svg viewBox="0 0 440 560" aria-hidden="true">
      <defs>
        <pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="26" height="26" class="p"/>
          <rect width="7" height="26" style="fill:color-mix(in srgb, var(--ink) 28%, var(--bg))"/>
        </pattern>
      </defs>
      <path d="M30,70 H410 V320 C410,450 316,520 220,552 C124,520 30,450 30,320 Z" style="fill:url(#hatch);stroke:var(--ink);stroke-width:12;stroke-linejoin:round"/>
      <path d="M54,94 H386 V318 C386,432 302,494 220,524 C138,494 54,432 54,318 Z" style="fill:none;stroke:var(--ink);stroke-width:6;stroke-linejoin:round"/>
      <g transform="translate(220 44)">
        <path class="r o" d="M-150,-6 L-238,0 L-206,32 L-240,66 L-150,56 Z"/>
        <path class="r o" d="M150,-6 L238,0 L206,32 L240,66 L150,56 Z"/>
        <path class="k o" d="M-180,40 L-150,56 L-150,40 Z"/><path class="k o" d="M180,40 L150,56 L150,40 Z"/>
        <path class="rb o" d="M-180,-30 Q0,-4 180,-30 L180,40 Q0,66 -180,40 Z"/>
        <text class="rb-small" x="6" y="34" text-anchor="middle">照片</text>
      </g>
    </svg>
    <div class="lab">封面照片｜4:5</div>
  </div>

  <div class="info"><span>[講者姓名]</span>　2026.11</div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
