<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Neo Frutiger 新水感科技｜示範封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #DDEFFB;
  --ink: #0E2A44;
  --a1: #0A6FB8; --a2: #3E8E23; --a3: #3E8E23;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

/* 光澤色：由背景推出一個更亮的版本。淺色配色時接近白色高光，深色配色時只比背景亮一點，不會吃掉淺色文字 */
.slide {
  --gloss: oklch(from var(--bg) calc(l + 0.12) calc(c * 0.6) h);
  /* 太陽、泡泡反光這類不壓字的高光：由 --a1 推出的近白色 */
  --shine: oklch(from var(--a1) 0.97 calc(c * 0.25) h);
  font-family: "Nunito Sans", "Noto Sans TC", sans-serif;
}

/* 天空 */
.sky {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 900px 520px at 1560px 40px, color-mix(in srgb, var(--shine) 70%, transparent), transparent 70%),
    linear-gradient(180deg,
      color-mix(in srgb, var(--a1) 62%, var(--bg)) 0%,
      color-mix(in srgb, var(--a1) 30%, var(--bg)) 34%,
      color-mix(in srgb, var(--a1) 8%, var(--bg)) 62%,
      var(--bg) 78%);
}
/* 極光帶 */
.aurora { position: absolute; left: 0; top: 0; width: 1920px; height: 600px; filter: blur(34px); opacity: .55; }
.aurora .r1 { fill: color-mix(in srgb, var(--a2) 55%, transparent); }
.aurora .r2 { fill: color-mix(in srgb, var(--shine) 60%, transparent); }

/* 鏡頭光暈 */
.flare { position: absolute; border-radius: 50%; }
.flare.f1 { left: 1490px; top: -30px; width: 150px; height: 150px;
  background: radial-gradient(circle, var(--shine) 0 30%, color-mix(in srgb, var(--shine) 0%, transparent) 70%); }
.flare.f2 { left: 1330px; top: 120px; width: 46px; height: 46px; border: 2px solid color-mix(in srgb, var(--shine) 60%, transparent);
  background: color-mix(in srgb, var(--shine) 18%, transparent); }
.flare.f3 { left: 1250px; top: 180px; width: 20px; height: 20px; background: color-mix(in srgb, var(--shine) 55%, transparent); }

/* 草地 */
.meadow { position: absolute; left: 0; bottom: 0; width: 1920px; height: 330px; }
.meadow .back  { fill: color-mix(in srgb, var(--a2) 50%, var(--bg)); }
.meadow .front { fill: url(#grass); }
.meadow .shine { fill: none; stroke: color-mix(in srgb, var(--shine) 75%, transparent); stroke-width: 5; stroke-linecap: round; }
.meadow .leaf  { fill: var(--a2); }
.meadow .leaf2 { fill: color-mix(in srgb, var(--a2) 70%, var(--shine)); }
.meadow .vein  { fill: none; stroke: color-mix(in srgb, var(--shine) 60%, transparent); stroke-width: 3; stroke-linecap: round; }
.g-top { stop-color: color-mix(in srgb, var(--a2) 85%, var(--shine)); }
.g-bot { stop-color: oklch(from var(--a2) calc(l - 0.14) c h); }

/* 亮面面板 */
.panel {
  position: absolute; border-radius: 48px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 82%, transparent),
    color-mix(in srgb, var(--bg) 92%, transparent));
  border: 2px solid color-mix(in srgb, var(--gloss) 90%, transparent);
  box-shadow:
    0 40px 70px -30px color-mix(in srgb, var(--a1) 55%, transparent),
    inset 0 -26px 50px -10px color-mix(in srgb, var(--a1) 16%, transparent),
    inset 0 2px 0 var(--gloss);
}
.panel::before {
  content: ""; position: absolute; left: 22px; right: 22px; top: 10px; height: 44%;
  border-radius: 38px 38px 120px 120px / 38px 38px 40px 40px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--gloss) 92%, transparent), color-mix(in srgb, var(--gloss) 0%, transparent));
  pointer-events: none;
}
.panel > * { position: relative; }

.cover { left: 120px; top: 170px; width: 900px; height: 570px; padding: 64px 72px 0; box-sizing: border-box; }

.pill {
  display: inline-flex; align-items: center; gap: 18px; height: 64px; padding: 0 34px 0 14px; border-radius: 32px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 72%, var(--gloss)) 0 48%, var(--ink) 52% 100%);
  box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--ink) 60%, transparent), inset 0 1px 0 color-mix(in srgb, var(--gloss) 60%, transparent);
  color: var(--bg); font: 700 28px/1 "Nunito Sans", "Noto Sans TC", sans-serif; letter-spacing: .06em;
}
.orb {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 36% 30%, var(--shine) 0 14%, color-mix(in srgb, var(--a1) 70%, var(--shine)) 32%, var(--a1) 62%, color-mix(in srgb, var(--a1) 70%, var(--ink)) 100%);
  box-shadow: inset 0 -3px 6px color-mix(in srgb, var(--ink) 25%, transparent);
}

h1 {
  margin: 50px 0 0; font: 700 106px/1.1 "Nunito Sans", "Noto Sans TC", sans-serif; letter-spacing: 0; white-space: nowrap;
  -webkit-box-reflect: below -14px linear-gradient(transparent 58%, color-mix(in srgb, var(--ink) 22%, transparent));
}
.sub { margin: 74px 0 0; font: 300 54px/1.1 "Nunito Sans", sans-serif; letter-spacing: .01em; }
.meta { margin-top: 30px; display: flex; align-items: center; gap: 18px; font: 400 28px/1 "Nunito Sans", "Noto Sans TC", sans-serif; }
.meta .drop { width: 22px; height: 28px; }
.meta .drop path { fill: var(--a1); }
.meta .drop circle { fill: var(--shine); }

/* 頁碼 */
.folio { right: 120px; top: 64px; height: 60px; min-width: 104px; padding: 0 24px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; font: 800 30px/1 "Nunito Sans", sans-serif; letter-spacing: .08em; }
.panel.folio { border-radius: 30px; }
.panel.folio::before { border-radius: 24px 24px 40px 40px; left: 10px; right: 10px; top: 5px; }

/* 圖片版位 */
.ph { left: 1100px; top: 270px; width: 720px; height: 405px; display: flex; align-items: center; justify-content: center; }
.ph span { font: 700 34px/1 "Nunito Sans", "Noto Sans TC", sans-serif; letter-spacing: .08em; }
.ph .frame { position: absolute; inset: 26px; border-radius: 30px; border: 2px dashed color-mix(in srgb, var(--a1) 45%, transparent); }

/* 泡泡與水珠 */
.bubble {
  position: absolute; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--shine) 95%, transparent) 0 9%, transparent 17%),
    radial-gradient(circle at 50% 52%, transparent 0 56%, color-mix(in srgb, var(--a1) 22%, transparent) 78%, color-mix(in srgb, var(--a1) 55%, transparent) 100%);
  border: 2px solid color-mix(in srgb, var(--shine) 70%, transparent);
  box-shadow: inset -6px -10px 18px -6px color-mix(in srgb, var(--a2) 35%, transparent);
}
.bubble::after {
  content: ""; position: absolute; right: 16%; bottom: 14%; width: 22%; height: 10%; border-radius: 50%;
  background: color-mix(in srgb, var(--shine) 60%, transparent); transform: rotate(-35deg);
}
.drop2 {
  position: absolute; width: 26px; height: 26px; border-radius: 50% 50% 50% 50% / 46% 46% 54% 54%;
  background: radial-gradient(circle at 34% 30%, var(--shine) 0 18%, color-mix(in srgb, var(--a1) 28%, transparent) 60%, color-mix(in srgb, var(--a1) 55%, transparent) 100%);
  box-shadow: 0 4px 6px -2px color-mix(in srgb, var(--a1) 40%, transparent);
}
</style>
</head>
<body>
<main class="slide">
  <div class="sky"></div>

  <svg class="aurora" viewBox="0 0 1920 600" aria-hidden="true">
    <path class="r1" d="M-100,250 C300,120 620,330 980,200 C1330,70 1600,230 2020,110 L2020,190 C1640,320 1330,170 980,300 C620,420 300,220 -100,350 Z"/>
    <path class="r2" d="M-100,180 C360,60 640,250 1000,140 C1360,30 1620,150 2020,60 L2020,100 C1620,200 1360,90 1000,200 C640,300 360,120 -100,230 Z"/>
  </svg>

  <div class="flare f1"></div><div class="flare f2"></div><div class="flare f3"></div>

  <svg class="meadow" viewBox="0 0 1920 330" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="g-top"/><stop offset="1" class="g-bot"/>
      </linearGradient>
    </defs>
    <path class="back" d="M0,170 C260,90 520,110 760,150 C1020,195 1260,120 1520,110 C1700,104 1830,130 1920,150 L1920,330 L0,330 Z"/>
    <path class="front" d="M0,250 C300,180 620,190 900,225 C1180,262 1460,200 1720,196 C1810,195 1880,205 1920,212 L1920,330 L0,330 Z"/>
    <path class="shine" d="M90,232 C320,182 600,190 860,220"/>
    <path class="shine" d="M1300,222 C1460,200 1600,196 1760,198"/>
    <g transform="translate(1040,232)">
      <path class="leaf" d="M0,0 C-10,-40 -60,-70 -104,-62 C-90,-20 -46,4 0,0 Z"/>
      <path class="leaf2" d="M4,0 C16,-52 62,-92 118,-90 C108,-38 62,-4 4,0 Z"/>
      <path class="vein" d="M0,-2 C-30,-22 -62,-44 -92,-58"/>
      <path class="vein" d="M6,-2 C36,-30 70,-62 104,-82"/>
    </g>
  </svg>

  <section class="panel cover">
    <div class="pill"><i class="orb"></i>2026 品牌提案</div>
    <h1>把想法做成產品</h1>
    <p class="sub">From Idea to Product</p>
    <div class="meta">
      <svg class="drop" viewBox="0 0 22 28" aria-hidden="true"><path d="M11,0 C15,8 22,13 22,19 A11,9 0 0 1 0,19 C0,13 7,8 11,0 Z"/><circle cx="7" cy="18" r="2.6"/></svg>
      [講者姓名]　2026.11
    </div>
  </section>

  <div class="panel folio">01</div>

  <div class="panel ph" data-slot="cover-photo" data-ratio="16/9">
    <i class="frame"></i>
    <span>照片｜16:9</span>
  </div>

  <i class="bubble" style="left:1040px; top:600px; width:130px; height:130px"></i>
  <i class="bubble" style="left:1735px; top:200px; width:92px; height:92px"></i>

  <i class="bubble" style="left:1000px; top:96px; width:56px; height:56px"></i>
  <i class="bubble" style="left:1180px; top:760px; width:44px; height:44px"></i>
  <i class="bubble" style="left:60px; top:820px; width:70px; height:70px"></i>
  <i class="bubble" style="left:1640px; top:740px; width:36px; height:36px"></i>

  <i class="drop2" style="left:930px; top:212px"></i>
  <i class="drop2" style="left:952px; top:250px; width:16px; height:16px"></i>
  <i class="drop2" style="left:1756px; top:610px; width:20px; height:20px"></i>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
