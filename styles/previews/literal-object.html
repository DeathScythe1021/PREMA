<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>實物擬態 Literal Object</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #D9D7D2; --ink: #1B1F27; --a1: #1F4FA8; --a2: #D2452C; --a3: #D2452C; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
.slide { width: 1920px; height: 1080px; transform-origin: 0 0; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }

/* desk under the object */
.desk { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 11%, var(--bg)); }
.slide { --desk: color-mix(in srgb, var(--ink) 11%, var(--bg)); font-family: "IBM Plex Sans", "Noto Sans TC", sans-serif; }

.pass { position: absolute; left: 140px; top: 166px; width: 1640px; height: 748px; background: var(--bg); border-radius: 26px;
  box-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 18%, transparent), 0 16px 30px -14px color-mix(in srgb, var(--ink) 32%, transparent); }
/* tear notches + perforation */
.pass::before, .pass::after { content: ""; position: absolute; left: 1172px; width: 56px; height: 56px; border-radius: 50%; background: var(--desk); z-index: 3; }
.pass::before { top: -28px; } .pass::after { bottom: -28px; }
.perf { position: absolute; left: 1197px; top: 40px; bottom: 40px; width: 6px;
  background: radial-gradient(circle, color-mix(in srgb, var(--ink) 55%, transparent) 0 3px, transparent 3.5px) 0 0 / 6px 18px repeat-y; }

.head { position: absolute; left: 0; top: 0; width: 1200px; height: 108px; background: var(--ink); color: var(--bg); border-radius: 26px 0 0 0;
  display: flex; align-items: center; padding: 0 56px; box-sizing: border-box; gap: 22px; }
.head.stub { left: 1200px; width: 440px; padding: 0 36px 0 68px !important; border-radius: 0 26px 0 0; padding: 0 40px; justify-content: space-between; }
.head .logo { width: 56px; height: 56px; }
.head .bp { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 8px; }
.head .kick { margin-left: auto; font-family: "Noto Sans TC", sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 3px; }
.head .kick b { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 36px; margin-right: 10px; letter-spacing: 2px; }
.head.stub .bp { font-size: 30px; letter-spacing: 6px; }

.lbl { display: block; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 21px; letter-spacing: 4px; text-transform: uppercase;
  color: color-mix(in srgb, var(--ink) 72%, var(--bg)); }

.title { position: absolute; left: 56px; top: 140px; }
.title h1 { margin: 6px 0 0; font-family: "Noto Sans TC", sans-serif; font-weight: 700; font-size: 112px; line-height: 1.08; letter-spacing: 4px; }

.route { position: absolute; left: 56px; top: 336px; display: flex; align-items: flex-end; gap: 22px; }
.route .v { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 94px; line-height: .95; letter-spacing: 2px; text-transform: uppercase; }
.route .fly { width: 150px; height: 70px; margin-bottom: 18px; }

.fields { position: absolute; left: 56px; top: 532px; display: flex; gap: 0; border-top: 4px solid var(--ink); padding-top: 22px; width: 860px; }
.fields > div { padding-right: 52px; margin-right: 40px; border-right: 3px solid color-mix(in srgb, var(--ink) 30%, var(--bg)); }
.fields > div:last-child { border: 0; margin: 0; padding: 0; }
.fields .val { font-family: "Oswald", "Noto Sans TC", sans-serif; font-weight: 500; font-size: 46px; line-height: 1.25; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.fields .val.zh { font-family: "Noto Sans TC", sans-serif; font-weight: 700; font-size: 40px; }

.stripe { position: absolute; left: 0; bottom: 0; width: 1200px; height: 26px; background: var(--a1); border-radius: 0 0 0 26px; }
.stripe.s2 { left: 1200px; width: 440px; border-radius: 0 0 26px 0; }

.ph { position: absolute; left: 912px; top: 146px; width: 228px; height: 304px; box-sizing: border-box;
  border: 4px solid var(--ink); background:
  repeating-linear-gradient(45deg, color-mix(in srgb, var(--ink) 10%, var(--bg)) 0 10px, var(--bg) 10px 20px);
  display: grid; place-items: center; }
.ph span { position: relative; z-index: 1; background: var(--bg); padding: 6px 12px; font-family: "Noto Sans TC", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 2px; }
.ph::before { content: ""; position: absolute; left: 50%; top: 34px; width: 76px; height: 76px; margin-left: -38px; border-radius: 50%;
  border: 4px dashed color-mix(in srgb, var(--ink) 45%, var(--bg)); }
.ph::after { content: ""; position: absolute; left: 30px; right: 30px; bottom: 0; height: 56px; border-radius: 80px 80px 0 0;
  border: 4px dashed color-mix(in srgb, var(--ink) 45%, var(--bg)); border-bottom: 0; }
.phl { position: absolute; left: 912px; top: 462px; width: 228px; text-align: center; }

.stamp { position: absolute; left: 930px; top: 520px; width: 210px; height: 210px; transform: rotate(-14deg); opacity: .9; }

.stubc { position: absolute; left: 1268px; top: 140px; width: 336px; }
.seat { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 200px; line-height: .9; letter-spacing: -2px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.mini { margin-top: 30px; display: flex; justify-content: space-between; }
.mini .val { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 40px; line-height: 1.2; letter-spacing: 1px; text-transform: uppercase; }
.bar { position: absolute; left: 1268px; top: 566px; width: 336px; height: 120px; }
.bar svg { width: 100%; height: 110px; display: block; fill: var(--ink); }
</style>
</head>
<body>
<main class="slide">
  <div class="desk"></div>

  <div class="pass">
    <div class="head">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" style="fill:var(--a1)"/><path transform="rotate(45 50 50)" d="M50,12 C53,12 55,17 55,24 V42 L84,58 V65 L55,56 V74 L64,81 V86 L50,83 L36,86 V81 L45,74 V56 L16,65 V58 L45,42 V24 C45,17 47,12 50,12 Z" style="fill:var(--bg)"/></svg>
      <span class="bp">BOARDING PASS</span>
      <span class="kick"><b>2026</b>品牌提案</span>
    </div>
    <div class="head stub"><span class="bp">BOARDING</span><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" style="fill:var(--a1)"/><path transform="rotate(45 50 50)" d="M50,12 C53,12 55,17 55,24 V42 L84,58 V65 L55,56 V74 L64,81 V86 L50,83 L36,86 V81 L45,74 V56 L16,65 V58 L45,42 V24 C45,17 47,12 50,12 Z" style="fill:var(--bg)"/></svg></div>

    <div class="title"><span class="lbl">Flight ／ 航班</span><h1>把想法做成產品</h1></div>

    <div class="route">
      <div><span class="lbl">From</span><div class="v">Idea</div></div>
      <svg class="fly" viewBox="0 0 150 70" aria-hidden="true">
        <path d="M6,35 H96" style="stroke:var(--ink);stroke-width:5;stroke-dasharray:4 12;stroke-linecap:round;fill:none"/>
        <path transform="translate(80 0) rotate(90 35 35) scale(.7)" d="M50,6 C54,6 56,12 56,20 V40 L92,60 V68 L56,58 V80 L68,88 V94 L50,90 L32,94 V88 L44,80 V58 L8,68 V60 L44,40 V20 C44,12 46,6 50,6 Z" style="fill:var(--a1)"/>
      </svg>
      <div><span class="lbl">To</span><div class="v">Product</div></div>
    </div>

    <div class="fields">
      <div><span class="lbl">Passenger</span><div class="val zh">[講者姓名]</div></div>
      <div><span class="lbl">Date</span><div class="val">2026.11</div></div>
      <div><span class="lbl">Seat</span><div class="val">01</div></div>
    </div>

    <div class="ph" data-slot="cover-photo" data-ratio="3/4"><span>照片｜3:4</span></div>
    <span class="lbl phl">Photo</span>

    <svg class="stamp" viewBox="0 0 200 200" aria-hidden="true" style="fill:none;stroke:var(--a2);stroke-linecap:round">
      <circle cx="100" cy="100" r="92" style="stroke-width:8"/>
      <circle cx="100" cy="100" r="74" style="stroke-width:4"/>
      <path d="M100,52 L111,86 L147,86 L118,107 L129,141 L100,120 L71,141 L82,107 L53,86 L89,86 Z" style="fill:var(--a2);stroke:none"/>
      <path d="M20,64 Q40,56 60,64 T100,64 T140,64 T180,64 M14,140 Q34,132 54,140 T94,140 T134,140 T186,140" style="stroke-width:5"/>
    </svg>

    <div class="perf"></div>

    <div class="stubc">
      <span class="lbl">Seat</span>
      <div class="seat">01</div>
      <div class="mini">
        <div><span class="lbl">From</span><div class="val">Idea</div></div>
        <div style="text-align:right"><span class="lbl">To</span><div class="val">Product</div></div>
      </div>
    </div>
    <div class="bar"><svg viewBox="0 0 352 110" preserveAspectRatio="none" aria-hidden="true"><rect x="0" width="4" height="110"/><rect x="8" width="6" height="110"/><rect x="17" width="3" height="110"/><rect x="28" width="3" height="110"/><rect x="37" width="8" height="110"/><rect x="48" width="8" height="110"/><rect x="60" width="3" height="110"/><rect x="66" width="6" height="110"/><rect x="75" width="3" height="110"/><rect x="82" width="3" height="110"/><rect x="93" width="6" height="110"/><rect x="102" width="5" height="110"/><rect x="115" width="3" height="110"/><rect x="122" width="3" height="110"/><rect x="133" width="3" height="110"/><rect x="144" width="8" height="110"/><rect x="155" width="3" height="110"/><rect x="162" width="3" height="110"/><rect x="173" width="5" height="110"/><rect x="182" width="4" height="110"/><rect x="189" width="3" height="110"/><rect x="200" width="3" height="110"/><rect x="211" width="4" height="110"/><rect x="223" width="5" height="110"/><rect x="232" width="3" height="110"/><rect x="243" width="8" height="110"/><rect x="255" width="4" height="110"/><rect x="262" width="8" height="110"/><rect x="273" width="8" height="110"/><rect x="284" width="8" height="110"/><rect x="296" width="6" height="110"/><rect x="310" width="6" height="110"/><rect x="322" width="6" height="110"/><rect x="336" width="6" height="110"/><rect x="348" width="4" height="110"/></svg></div>

    <div class="stripe"></div><div class="stripe s2"></div>
  </div>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  ['bg', 'ink', 'a1', 'a2', 'a3'].forEach(function (k) {
    var v = p.get(k);
    if (v && /^[0-9a-fA-F]{6}$/.test(v)) document.documentElement.style.setProperty('--' + k, '#' + v);
  });
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
